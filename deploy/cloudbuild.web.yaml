# FILE: deploy/cloudbuild.web.yaml
#
# Builds the cadence-web image (the repo's Dockerfile) on Cloud Build. The
# Firebase web config arrives as substitutions from deploy/cloudrun.sh; it is
# public and gets inlined into the browser bundle. No secret is a build arg.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_IMAGE}
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - --build-arg=NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY=${_RECAPTCHA_SITE_KEY}
      - .
images:
  - ${_IMAGE}
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
