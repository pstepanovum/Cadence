# FILE: deploy/cloudbuild.ai.yaml
#
# Builds the cadence-ai image from src/backend with the models baked in.
steps:
  - name: gcr.io/cloud-builders/docker
    # The Dockerfile's heredoc RUN needs BuildKit. Whisper stays out: the
    # transcription benchmark picked Gemini (docs/PLATFORM.md 6.2).
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --file=ai-engine/Dockerfile.cloud
      - --build-arg=ASR_MODEL=
      - --tag=${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
timeout: 3600s
