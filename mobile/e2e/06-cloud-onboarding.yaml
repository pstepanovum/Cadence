# First run choosing Cadence Cloud: a free account against the Auth
# emulator, then the Plus step with store prices and Restore purchases.
# env: EMAIL, PASSWORD
appId: dev.pstepanov.cadence
name: Cloud onboarding
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      notifications: allow
      microphone: allow
- tapOn: "Skip"
- tapOn: "Grammar precision.*"
- tapOn: "Continue"
- tapOn: "C1 · Advanced.*"
- tapOn: "Continue"
- tapOn: "Continue"
- tapOn: "Not now"
- tapOn: "Cadence Cloud.*"
- tapOn: "Continue"
- assertVisible: "Create your free account"
- assertNotVisible: "Not now"
- tapOn:
    id: "account-email"
- inputText: ${EMAIL}
- tapOn:
    id: "account-password"
# iOS may offer a strong password for a new-password field; type our own.
- tapOn:
    text: "Choose My Own Password"
    optional: true
- inputText: ${PASSWORD}
# Tapping the page's heading closes the keyboard.
- tapOn: "Create your free account"
- tapOn: "Create account"
- runFlow: subflows/decline-save-password.yaml
# A new account moves straight on to Plus.
- extendedWaitUntil:
    visible: "Practise with AI anywhere"
    timeout: 20000
- scrollUntilVisible:
    element: "Monthly, .* a month"
- assertVisible: "Yearly, 7-day free trial, then .* a year"
- scrollUntilVisible:
    element: "Restore purchases"
- assertVisible: "Privacy"
- assertVisible: "Terms"
- takeScreenshot: 06-paywall
- tapOn: "Restore purchases"
- assertVisible: "No Plus subscription found.*"
- runFlow: subflows/decline-save-password.yaml
- tapOn: "Not now"
- extendedWaitUntil:
    visible: "Hi .*"
    timeout: 15000
- takeScreenshot: 06-cloud-home
- scrollUntilVisible:
    element: "Get Cadence Plus"
- assertVisible: "Connect your own Cadence server"
- takeScreenshot: 06-ai-offer
