# Answers whatever exercise is on screen until the session ends. Correctness
# does not matter here; every kind of input has to work.
appId: dev.pstepanov.cadence
---
- repeat:
    times: 40
    while:
      notVisible: "(?i)session complete"
    commands:
      - runFlow:
          when:
            visible: "Show the answer"
          commands:
            - tapOn: "Show the answer"
            - tapOn:
                text: "Got it"
                optional: true
      - runFlow:
          when:
            visible:
              id: "choice-0"
          commands:
            - tapOn:
                id: "choice-0"
      - runFlow:
          when:
            visible:
              id: "match-left-0"
          file: match-all.yaml
      - repeat:
          times: 12
          while:
            visible:
              id: "token-0"
          commands:
            - tapOn:
                id: "token-0"
      - runFlow:
          when:
            visible:
              id: "bank-0"
          commands:
            - tapOn:
                id: "bank-0"
            - tapOn:
                id: "bank-0"
            - tapOn:
                id: "bank-0"
      - runFlow:
          when:
            visible:
              id: "gap-0"
          commands:
            - tapOn:
                id: "gap-0"
            - inputText: "is"
            # The keyboard can cover the next gap (an iPhone SE, or three gaps);
            # close it first, or the tap lands on the keyboard and types here again.
            - tapOn:
                text: "(?i).* · \\d+ of \\d+"
                optional: true
      - runFlow:
          when:
            visible:
              id: "gap-1"
          commands:
            - tapOn:
                id: "gap-1"
            - inputText: "is"
            - tapOn:
                text: "(?i).* · \\d+ of \\d+"
                optional: true
      - runFlow:
          when:
            visible:
              id: "gap-2"
          commands:
            - tapOn:
                id: "gap-2"
            - inputText: "is"
            - tapOn:
                text: "(?i).* · \\d+ of \\d+"
                optional: true
      - runFlow:
          when:
            visible:
              id: "gap-3"
          commands:
            - tapOn:
                id: "gap-3"
            - inputText: "is"
      - runFlow:
          when:
            visible:
              id: "typed-answer"
          commands:
            - tapOn:
                id: "typed-answer"
            - inputText: " ok"
      - scrollUntilVisible:
          element: "Check|Next|See results"
          timeout: 4000
          optional: true
      - runFlow:
          when:
            visible: "Check"
          commands:
            # hideKeyboard fails on an iPhone SE once two gap fields are
            # filled; a tap on the step's eyebrow (plain text in the scroll
            # view) dismisses the keyboard and works on every exercise.
            - tapOn:
                text: "(?i).* · \\d+ of \\d+"
                optional: true
            - tapOn:
                text: "Check"
                optional: true
      - scrollUntilVisible:
          element: "Next|See results"
          timeout: 4000
          optional: true
      - runFlow:
          when:
            visible: "Next"
          commands:
            - tapOn:
                text: "Next"
                optional: true
      - runFlow:
          when:
            visible: "See results"
          commands:
            - tapOn:
                text: "See results"
                optional: true
- assertVisible: "(?i)session complete"
