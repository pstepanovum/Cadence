# iOS 27 offers to save a password typed into a sign-in or sign-up form. The
# sheet hides the app from Maestro until it is declined.
appId: dev.pstepanov.cadence
---
- extendedWaitUntil:
    visible: "Save Password.*"
    timeout: 4000
    optional: true
- runFlow:
    when:
      visible: "Save Password.*"
    commands:
      - tapOn: "Not Now"
